<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Admin Login | Ritik Verma</title>

    <link rel="stylesheet" href="/admin/admin.css">

</head>

<body>

    <div class="glow glow-one"></div>
    <div class="glow glow-two"></div>

    <div class="login-box">

        <div class="profile">

            <img
                src="/images/main.png"
                alt="Ritik Verma"
            >

        </div>

        <h1>
            Admin <span>Login</span>
        </h1>

        <p>
            MR. RITIKVERMA
        </p>

        <form id="loginForm">

            <div class="input-group">

                <input
                    type="password"
                    id="password"
                    placeholder="Enter admin password"
                    autocomplete="current-password"
                    required
                >

            </div>

            <button type="submit">

                Login
                <span>→</span>

            </button>

            <div id="error"></div>

        </form>

        <div class="back">

            <a href="/">
                ← Back to Website
            </a>

        </div>

    </div>

    <script src="/admin/admin.js"></script>

</body>

</html>
