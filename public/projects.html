<h1>Saved Projects 📂</h1>

<div id="projectList"></div>


<!-- =====================================================
     PROFESSIONAL MODAL
===================================================== -->

<div
    id="siteModalOverlay"
    class="site-modal-overlay"
>

    <div
        id="siteModal"
        class="site-modal"
    >

        <div class="site-modal-header">

            <div class="site-modal-title-area">

                <div
                    id="siteModalIcon"
                    class="site-modal-icon"
                >
                    🔐
                </div>

                <div>

                    <h3 id="siteModalTitle">
                        Enter Information
                    </h3>

                    <p id="siteModalSubtitle">
                        Please enter the required information.
                    </p>

                </div>

            </div>

            <button
                type="button"
                id="siteModalClose"
                class="site-modal-close"
            >
                ×
            </button>

        </div>


        <div
            id="siteModalBody"
            class="site-modal-body"
        ></div>


        <div
            id="siteModalActions"
            class="site-modal-actions"
        ></div>

    </div>

</div>


<script src="/script.js"></script>

<script>
async function loadProjects(){
    const res = await fetch("/projects");
    const projects = await res.json();

    const container = document.getElementById("projectList");
    container.innerHTML = "";

    projects.forEach(p => {
        const div = document.createElement("div");
        div.classList.add("project-card");

        div.innerHTML = `
            <h3>${p.title}</h3>
            <button class="open-btn" onclick="openProject('${p.title}','${p.language}')">Open</button>
            <button class="download-btn" onclick="downloadProject('${p.title}','${p.language}')">Download</button>
            <button class="delete-btn" onclick="deleteProject('${p.title}','${p.language}')">Delete</button>
        `;

        container.appendChild(div);
    });
}

function downloadProject(title, lang){
    window.location.href = `/download/${title}/${lang}`;
}

function openProject(title, lang){
    fetch(`/download/${title}/${lang}`)
    .then(res => res.text())
    .then(code => {
        localStorage.setItem("openedCode", code);
        localStorage.setItem("openedLang", lang);
        window.location.href = "/coding.html";
    });
}

async function deleteProject(title, lang) {

    const password =
        await sitePrompt({

            title:
                "Admin Verification",

            subtitle:
                "Enter your admin password to delete this project.",

            label:
                "Admin Password",

            placeholder:
                "Enter admin password",

            type:
                "password",

            icon:
                "🔐"

        });


    /* User clicked Cancel */

    if (
        password === null
    ) {

        return;

    }


    /* Empty password */

    if (
        !password.trim()
    ) {

        await siteNotice({

            title:
                "Password Required",

            subtitle:
                "Project was not deleted.",

            message:
                "Please enter your admin password.",

            icon:
                "⚠️"

        });

        return;

    }


    try {

        const response =
            await fetch(
                `/delete/${encodeURIComponent(title)}/${encodeURIComponent(lang)}`,
                {

                    method:
                        "DELETE",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body:
                        JSON.stringify({

                            password:
                                password

                        })

                }
            );


        const data =
            await response.json();


        /* WRONG PASSWORD */

        if (
            response.status === 403
        ) {

            await siteNotice({

                title:
                    "Incorrect Password",

                subtitle:
                    "Authorization failed.",

                message:
                    "The admin password you entered is incorrect.",

                icon:
                    "🔒",

                type:
                    "danger"

            });

            return;

        }


        /* PROJECT NOT FOUND */

        if (
            response.status === 404
        ) {

            await siteNotice({

                title:
                    "Project Not Found",

                subtitle:
                    "The project could not be deleted.",

                message:
                    "This project may have already been deleted.",

                icon:
                    "⚠️"

            });

            return;

        }


        /* OTHER SERVER ERROR */

        if (
            !response.ok
        ) {

            await siteNotice({

                title:
                    "Delete Failed",

                subtitle:
                    "The project could not be deleted.",

                message:
                    data.message ||
                    "Please try again.",

                icon:
                    "❌",

                type:
                    "danger"

            });

            return;

        }


        /* SUCCESS */

        await siteNotice({

            title:
                "Project Deleted",

            subtitle:
                "The project has been removed.",

            message:
                `"${title}" was deleted successfully.`,

            icon:
                "🗑️"

        });


        loadProjects();


    } catch (error) {

        console.error(
            "Delete project error:",
            error
        );


        await siteNotice({

            title:
                "Connection Error",

            subtitle:
                "Unable to delete the project.",

            message:
                "Please check your connection and try again.",

            icon:
                "❌",

            type:
                "danger"

        });

    }

}

loadProjects();
</script>
